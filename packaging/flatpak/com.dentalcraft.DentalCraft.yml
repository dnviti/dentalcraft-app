# Flatpak manifest of DentalCraft, built by packaging/flatpak/build.sh (sourced by
# packaging/installers.sh) from the release binaries, not from source: the module
# copies the /app tree that the script stages in app/ next to this file.
app-id: com.dentalcraft.DentalCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: dentalcraft
finish-args:
  # GPU rendering (wgpu: Vulkan, or OpenGL through EGL)
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Sign-in, support and the update check
  - --share=network
  # The sign-in session (refresh token) is kept in the OS keyring (Secret Service)
  - --talk-name=org.freedesktop.secrets
  # Projects live in ~/DentalCraft; scans are opened from anywhere in the home folder
  - --filesystem=home
modules:
  - name: dentalcraft
    buildsystem: simple
    build-options:
      # Ship the binaries exactly as in the other packages.
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: app
    build-commands:
      - cp -a . /app/
