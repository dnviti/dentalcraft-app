name: release-please

# Versioning with release-please: Conventional Commits on main (feat:, fix:,
# feat!: ...) open or update a release PR that bumps the CHANGELOG (and the
# version file). Merging it tags vX.Y.Z and publishes the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: golgari-dev
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attach the compiled binaries to the release just created. Called directly
  # (not through a release event) so it runs even though the release is made
  # with GITHUB_TOKEN. To backfill a tag: gh workflow run binaries.yml -f tag=vX.Y.Z
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
