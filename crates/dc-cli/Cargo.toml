[package]
name = "dc-cli"
description = "dentalcraft-cli: command line and MCP server to drive DentalCraft headless or through a running app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "dentalcraft-cli"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
dc-case.workspace = true
dc-i18n.workspace = true
dc-mcp.workspace = true
dc-module-api.workspace = true
dc-raster.workspace = true
dc-session.workspace = true
dca-model.workspace = true
dca-module.workspace = true
serde_json.workspace = true

[dev-dependencies]
# end-to-end test of `mcp --connect` against the app bridge (headless egui loop)
dc-app = { path = "../dc-app" }
# decodes the golden fixture scans of the end-to-end pipeline test
dc-mesh.workspace = true
egui.workspace = true
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
